name: Tests

on:
  push:
    branches: [master, ui-upgrade]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when run from release.yml, so releases get their own group
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # lowest supported PHP for syntax, newest PHP for compile-time deprecations
        php: ['8.0', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint src/ (syntax errors and deprecations)
        run: |
          output=$(find src -name '*.php' -print0 \
            | xargs -0 -n1 php -d error_reporting=E_ALL -d display_errors=stderr -d log_errors=0 -l 2>&1 \
            | grep -v '^No syntax errors detected' || true)
          if [ -n "$output" ]; then
            echo "$output"
            exit 1
          fi

  smoke:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 9, php: '8.3' }
          - { laravel: 10, php: '8.3' }
          - { laravel: 11, php: '8.3' }
          - { laravel: 12, php: '8.3' }
          - { laravel: 13, php: '8.3' }
          - { laravel: 11, php: '8.4' }
          - { laravel: 12, php: '8.4' }
          - { laravel: 13, php: '8.4' }
          - { laravel: 12, php: '8.5' }
          - { laravel: 13, php: '8.5' }
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, gd, fileinfo
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-laravel${{ matrix.laravel }}-php${{ matrix.php }}-${{ github.run_id }}
          restore-keys: composer-laravel${{ matrix.laravel }}-php${{ matrix.php }}-

      - name: Create Laravel ${{ matrix.laravel }} app with this package
        run: tests/smoke/setup-app.sh ${{ matrix.laravel }} "$RUNNER_TEMP/app"

      - name: Smoke test (feature test, fails on any deprecation)
        working-directory: ${{ runner.temp }}/app
        run: vendor/bin/phpunit --filter AdminSmokeTest

      - name: HTTP smoke test (real server and session)
        run: tests/smoke/http-smoke.sh "$RUNNER_TEMP/app"

  ui:
    # drives the showcase like a user (tests/smoke/ui): plugins, grid, forms, db round trips
    name: UI interactions (Laravel 13 / PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, gd, fileinfo
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Create Laravel 13 app with this package and the UI showcase
        run: |
          tests/smoke/setup-app.sh 13 "$RUNNER_TEMP/app"
          tests/smoke/ui/setup-ui.sh "$RUNNER_TEMP/app"

      - name: Install the harness (puppeteer-core; Chrome comes with the runner)
        working-directory: tests/smoke/ui
        run: npm install --no-audit --no-fund

      - name: Interactions
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/smoke/ui/interactions.mjs "$RUNNER_TEMP/app"

      - name: Screenshots (fail on JS errors, failed requests or interactions)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node tests/smoke/ui/screenshots.mjs "$RUNNER_TEMP/app" "$RUNNER_TEMP/shots" | tee "$RUNNER_TEMP/shots.log"
          ! grep -q '^WARN' "$RUNNER_TEMP/shots.log"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
